<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiques - FASO GESTION IA</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            font-family:Arial;
            background:#f4fff7;
            margin:0;
        }

        header{
            background:linear-gradient(135deg,#198754,#0d6b42);
            color:white;
            padding:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h1{
            font-size:24px;
        }

        .container{
            padding:30px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
        }

        .card h3{
            color:#198754;
            margin-bottom:10px;
        }

        .card p{
            font-size:22px;
            font-weight:bold;
        }

        .chart-box{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.08);
        }

        footer{
            text-align:center;
            padding:20px;
            color:#666;
        }

    </style>

</head>

<body>

<header>
    <h1>📊 Statistiques Pro</h1>
    <a href="/" style="color:white;text-decoration:none;">🏠 Retour</a>
</header>

<div class="container">

    <!-- CARDS -->
    <div class="cards">

        <div class="card">
            <h3>Ventes</h3>
            <p>{{ total_ventes }} FCFA</p>
        </div>

        <div class="card">
            <h3>Bénéfices</h3>
            <p>{{ benefices }} FCFA</p>
        </div>

        <div class="card">
            <h3>Dépenses</h3>
            <p>{{ total_depenses }} FCFA</p>
        </div>

        <div class="card">
            <h3>Factures</h3>
            <p>{{ total_factures }}</p>
        </div>

    </div>

    <!-- GRAPH -->
    <div class="chart-box">
        <canvas id="chart"></canvas>
    </div>

</div>

<script>

const ctx = document.getElementById('chart');

new Chart(ctx, {
    type: 'doughnut',
    data: {
        labels: ['Ventes', 'Bénéfices', 'Dépenses'],
        datasets: [{
            data: [
                {{ total_ventes }},
                {{ benefices }},
                {{ total_depenses }}
            ],
            backgroundColor: ['#198754', '#0d6efd', '#dc3545']
        }]
    }
});

</script>

<footer>
    © 2026 FASO GESTION IA
</footer>

</body>
</html>
