<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Modifier client</title>

<style>

body{
    background:#f4fff7;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.form-box{
    background:white;
    padding:40px;
    border-radius:20px;
    width:450px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    color:#198754;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:15px;
    background:#198754;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="form-box">

<h1>✏ Modifier Client</h1>

<form method="POST">

<input type="text"
name="nom"
value="{{ client.nom }}"
required>

<input type="text"
name="telephone"
value="{{ client.telephone }}"
required>
    
<button type="submit">
Ajouter
</button>

</form>

</div>

</body>
</html>
