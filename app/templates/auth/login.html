<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion</title>

<style>

body{
    font-family:Arial;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:40px;
    width:350px;
    border-radius:15px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
}

a{
    text-decoration:none;
}

</style>

</head>
<body>

<div class="box">

<h2>Connexion</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">

<input type="text" name="username" placeholder="Nom utilisateur">

<input type="password" name="password" placeholder="Mot de passe">

<button type="submit">
Connexion
</button>

</form>

<br>

<a href="/register">
Créer un compte
</a>

</div>

</body>
</html>
