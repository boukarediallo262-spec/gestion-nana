<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Créer compte</title>
</head>
<body>

<h1>Créer un compte</h1>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">

<input type="text" name="username" placeholder="Nom utilisateur">

<input type="password" name="password" placeholder="Mot de passe">

<button type="submit">
Créer compte
</button>

</form>

<a href="/login">
Connexion
</a>

</body>
</html>
