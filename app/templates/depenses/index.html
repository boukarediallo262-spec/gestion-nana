<!DOCTYPE html>
<html>
<head>

    <title>Dépenses</title>

    <style>

        body{
            font-family:Arial;
            background:#f4fff7;
            padding:20px;
        }

        h1{
            color:#198754;
        }

        .top{
            margin-bottom:20px;
        }

        .btn{
            background:#198754;
            color:white;
            padding:10px 15px;
            text-decoration:none;
            border-radius:8px;
            margin-right:10px;
        }

        .delete{
            background:red;
        }

        table{
            width:100%;
            background:white;
            border-collapse:collapse;
            border-radius:10px;
            overflow:hidden;
        }

        th{
            background:#198754;
            color:white;
        }

        th,td{
            padding:15px;
            border-bottom:1px solid #ddd;
        }

        .total{
            margin-top:20px;
            background:white;
            padding:20px;
            border-radius:10px;
            font-size:22px;
            color:#198754;
        }

    </style>

</head>

<body>

    <h1>💰 Gestion des Dépenses</h1>

    <div class="top">

        <a class="btn" href="/ajouter_depense">
            ➕ Ajouter Dépense
        </a>

        <a class="btn" href="/">
            🏠 Accueil
        </a>

    </div>

    <table>

        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Montant</th>
            <th>Action</th>
        </tr>

        {% for depense in depenses %}

        <tr>

            <td>{{ depense.id }}</td>

            <td>{{ depense.nom }}</td>

            <td>{{ depense.montant }} FCFA</td>

            <td>

                <a class="btn delete"
                   href="/supprimer_depense/{{ depense.id }}">
                   Supprimer
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

    <div class="total">

        Total Dépenses :
        <strong>{{ total }} FCFA</strong>

    </div>

</body>
</html>
