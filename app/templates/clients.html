<!DOCTYPE html>
<html>
<head>

    <title>Clients</title>

    <style>

        body{
            font-family:Arial;
            background:#f4fff7;
            padding:20px;
        }

        h1{
            color:#198754;
        }

        .btn{
            background:#198754;
            color:white;
            padding:10px 15px;
            text-decoration:none;
            border-radius:8px;
            margin-right:10px;
        }

        .delete{
            background:red;
        }

        table{
            width:100%;
            background:white;
            border-collapse:collapse;
            border-radius:10px;
            overflow:hidden;
            margin-top:20px;
        }

        th{
            background:#198754;
            color:white;
        }

        th,td{
            padding:15px;
            border-bottom:1px solid #ddd;
        }

    </style>

</head>

<body>

    <h1>👥 Gestion des Clients</h1>

    <a class="btn" href="/ajouter_client">
        ➕ Ajouter Client
    </a>

    <a class="btn" href="/">
        🏠 Accueil
    </a>

    <table>

        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Adresse</th>
            <th>Action</th>
        </tr>

        {% for client in clients %}

        <tr>

            <td>{{ client.id }}</td>

            <td>{{ client.nom }}</td>

            <td>{{ client.telephone }}</td>

            <td>{{ client.adresse }}</td>

            <td>

                <a class="btn delete"
                   href="/supprimer_client/{{ client.id }}">
                   Supprimer
                </a>

            </td>

        </tr>

        {% endfor %}

    </table>

</body>
</html>
