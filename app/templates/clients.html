<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clients</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#f4fff7;
    padding:30px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
    flex-wrap:wrap;
    gap:15px;
}

h1{
    color:#198754;
}

.btn{
    background:#198754;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:12px;
    font-weight:bold;
}

.btn:hover{
    background:#146c43;
}

.card{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.search{
    margin-bottom:20px;
}

.search input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #ccc;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#198754;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #eee;
}

.action-btn{
    padding:8px 12px;
    border-radius:8px;
    color:white;
    text-decoration:none;
    font-size:14px;
}

.edit{
    background:#0d6efd;
}

.delete{
    background:#dc3545;
}

.stats{
    margin-bottom:20px;
    font-size:18px;
    font-weight:bold;
    color:#198754;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:#198754;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="topbar">
    <h1>👥 Gestion des Clients</h1>

    <a href="/ajouter-client" class="btn">
        + Ajouter Client
    </a>
</div>

<div class="card">

    <div class="stats">
        Total Clients : {{ total_clients }}
    </div>

    <form method="GET" class="search">
        <input type="text" name="recherche"
        placeholder="Rechercher un client...">
    </form>

    <table>

        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Téléphone</th>
            <th>Actions</th>
        </tr>

        {% for client in clients %}
        <tr>

            <td>{{ client.id }}</td>
            <td>{{ client.nom }}</td>
            <td>{{ client.telephone }}</td>

            <td>

                <a href="/modifier-client/{{ client.id }}"
                class="action-btn edit">
                Modifier
                </a>

                <a href="/supprimer-client/{{ client.id }}"
                class="action-btn delete">
                Supprimer
                </a>

            </td>

        </tr>
        {% endfor %}

    </table>

    <a href="/" class="back">
        ← Retour Dashboard
    </a>

</div>

</body>
</html>
