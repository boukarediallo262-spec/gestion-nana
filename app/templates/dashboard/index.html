<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faso Gestion IA</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0f172a;
    color:white;
}

.sidebar{
    width:250px;
    height:100vh;
    background:#111827;
    position:fixed;
    left:0;
    top:0;
    padding:20px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    margin-bottom:40px;
    color:#22c55e;
}

.menu a{
    display:block;
    color:#cbd5e1;
    text-decoration:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:10px;
    transition:0.3s;
}

.menu a:hover{
    background:#1e293b;
    color:white;
}

.main{
    margin-left:250px;
    padding:30px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:25px;
}

.card{
    background:#1e293b;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.card h2{
    font-size:30px;
    margin-top:10px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.badge{
    background:#22c55e;
    padding:8px 14px;
    border-radius:30px;
    font-size:14px;
}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
Faso Gestion IA
</div>

<div class="menu">
<a href="#">📊 Dashboard</a>
<a href="#">📦 Produits</a>
<a href="#">🧾 Factures</a>
<a href="#">💸 Dépenses</a>
<a href="#">🤖 IA Business</a>
<a href="#">💎 Abonnement</a>
<a href="#">⚙ Paramètres</a>
</div>

</div>

<div class="main">

<div class="topbar">
<h1>Dashboard SaaS</h1>

<div class="badge">
Abonnement Actif
</div>
</div>

<div class="cards">

<div class="card">
<p>💰 Ventes</p>
<h2>450 000 FCFA</h2>
</div>

<div class="card">
<p>📈 Bénéfice</p>
<h2>210 000 FCFA</h2>
</div>

<div class="card">
<p>📦 Produits</p>
<h2>128</h2>
</div>

<div class="card">
<p>🧾 Factures</p>
<h2>34</h2>
</div>

</div>

</div>

</body>
</html>
