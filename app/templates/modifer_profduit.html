<h1>Modifier Produit</h1>

<form method="POST">

    <input
        type="text"
        name="nom"
        value="{{ produit.nom }}"
    >

    <input
        type="number"
        name="prix"
        value="{{ produit.prix }}"
    >

    <input
        type="number"
        name="stock"
        value="{{ produit.stock }}"
    >

    <button type="submit">
        Modifier
    </button>

</form>
