<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Nouvelle Facture</title>

    <style>

        body{
            font-family:Arial;
            background:#f4fff7;
            padding:30px;
        }
 
        .box{

            background:white;

            max-width:700px;

            margin:auto;

            padding:30px;

            border-radius:20px;

            box-shadow:0 5px 15px rgba(0,0,0,0.1);

        }

        h1{
            color:#198754;
            margin-bottom:25px;
        }

        input,select{

            width:100%;

            padding:15px;

            margin-bottom:20px;

            border-radius:10px;

            border:1px solid #ccc;

        }

        button{

            background:#198754;

            color:white;

            border:none;

            padding:15px;

            width:100%;

            border-radius:10px;

            font-size:18px;

            cursor:pointer;

        }

    </style>

</head>

<body>

<div class="box">

    <h1>🧾 Nouvelle Facture</h1>

 <form method="POST">

    <input
        type="text"
        name="client"
        placeholder="Nom du client"
        required
    >

    <input
        type="date"
        name="date_facture"
    >

    <select name="paiement" required>

        <option value="">
            Mode de paiement
        </option>

        <option value="Espèces">
            Espèces
        </option>

        <option value="Mobile Money">
            Mobile Money
        </option>

        <option value="Bancaire">
            Bancaire
        </option>

        <option value="En attente">
            En attente
        </option>

    </select>

    <h3>Produits</h3>

<div id="produits-container">

    <div class="ligne-produit">

        <select name="produit_id[]" required>

            <option value="">
                Choisir un produit
            </option>

            {% for produit in produits %}

            <option value="{{ produit.id }}">
                {{ produit.nom }}
                -
                {{ produit.prix }} FCFA
                -
                Stock: {{ produit.quantite }}
            </option>

            {% endfor %}

        </select>

        <input
            type="number"
            name="quantite[]"
            placeholder="Quantité"
            required
        >

    </div>

</div>

<button
    type="button"
    onclick="ajouterLigne()">

    ➕ Ajouter un produit

</button>

<br><br>

</form>   
</div>
<script>

function ajouterLigne() {

    let container =
        document.getElementById("produits-container");

    let ligne =
        container.children[0].cloneNode(true);

    ligne.querySelector("input").value = "";

    ligne.querySelector("select").selectedIndex = 0;

    container.appendChild(ligne);

}

</script>
</body>
</htm
