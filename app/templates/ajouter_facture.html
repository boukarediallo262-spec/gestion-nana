<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <title>Nouvelle Facture</title>

    <style>

        body{
            font-family:Arial;
            background:#f4fff7;
            padding:30px;
        }

        h1{
            color:#198754;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:15px;
        }

        input, select{
            width:100%;
            padding:12px;
            margin-top:10px;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #ddd;
            padding:12px;
        }

        th{
            background:#198754;
            color:white;
        }

        button{
            background:#198754;
            color:white;
            border:none;
            padding:15px;
            border-radius:10px;
            cursor:pointer;
            width:100%;
            font-size:18px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>🧾 Nouvelle Facture</h1>

        <form method="POST">

            <label>Nom du client</label>

            <input
                type="text"
                name="client"
                required
            >

            <label>Mode de paiement</label>

            <select name="mode_paiement">

                <option>Espèces</option>

                <option>Mobile Money</option>

                <option>Bancaire</option>

                <option>En attente</option>

            </select>

            <br><br>

            <table>

                <tr>
                    <th>Produit</th>
                    <th>Prix</th>
                    <th>Stock</th>
                    <th>Quantité</th>
                </tr>

                {% for produit in produits %}

                <tr>

                    <td>{{ produit.nom }}</td>

                    <td>{{ produit.prix }} FCFA</td>

                    <td>{{ produit.quantite }}</td>

                    <td>

                        <input
                            type="number"
                            min="0"
                            name="quantite_{{ produit.id }}"
                            value="0"
                        >

                    </td>

                </tr>

                {% endfor %}

            </table>

            <br>

            <button type="submit">

                Générer la Facture

            </button>

        </form>

    </div>

</body>

</html>
