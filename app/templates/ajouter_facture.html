<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">

    <title>Ajouter Facture</title>

    <style>

        body{
            font-family:Arial;
            background:#f4fff7;
            padding:40px;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:15px;
            width:400px;
            margin:auto;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }

        h1{
            color:#198754;
            text-align:center;
        }

        input{
            width:100%;
            padding:15px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:10px;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:15px;
            background:#198754;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
        }

        a{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#198754;
            text-decoration:none;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>➕ Nouvelle Facture</h1>

        <form method="POST">

            <input
                type="text"
                name="client"
                placeholder="Nom du client"
                required
            >

            <input
                type="number"
                name="montant"
                placeholder="Montant"
                required
            >

            <button type="submit">
                Enregistrer Facture
            </button>

        </form>

        <a href="/factures">
            ← Retour Factures
        </a>

    </div>

</body>
</html>
