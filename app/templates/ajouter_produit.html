<h1>Ajouter Produit</h1>

<form method="POST" action="{{ url_for('produit.ajouter_produit') }}">
    <input type="text" name="nom" required>

    <input type="number" step="0.01" name="prix" required>

    <input type="number" name="stock" required>


    <button type="submit">
        Ajouter Produit
    </button>

</form>
