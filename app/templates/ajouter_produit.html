<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter Produit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- STYLE -->
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4fff7;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:600px;
            background:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#198754;
            font-size:30px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:12px;
            font-size:15px;
            outline:none;
            transition:0.3s;
        }

        input:focus{
            border:2px solid #198754;
        }

        button{
            width:100%;
            padding:15px;
            background:#198754;
            color:white;
            border:none;
            border-radius:12px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        button:hover{
            background:#146c43;
        }

        .back{
            display:block;
            text-align:center;
            margin-top:20px;
            color:#198754;
            text-decoration:none;
            font-weight:bold;
        }

        .back:hover{
            text-decoration:underline;
        }

        .flash{
            background:#d1e7dd;
            color:#0f5132;
            padding:10px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>➕ Ajouter un Produit</h1>

    <!-- FLASH MESSAGE -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- FORMULAIRE -->
    <form method="POST" action="{{ url_for('produit.ajouter_produit') }}">

        <div class="form-group">
            <label>Nom du produit</label>
            <input type="text" name="nom" placeholder="Ex: Riz 50kg" required>
        </div>

        <div class="form-group">
            <label>Prix</label>
            <input type="number" step="0.01" name="prix" placeholder="Ex: 25000" required>
        </div>

        <div class="form-group">
            <label>Stock</label>
            <input type="number" name="stock" placeholder="Ex: 10" required>
        </div>

        <button type="submit">Ajouter Produit</button>

    </form>

    <a class="back" href="{{ url_for('produit.produits') }}">
        ← Retour à la liste
    </a>

</div>

</body>
</html>
