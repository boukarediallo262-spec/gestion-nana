{% extends "layout.html" %}

{% block content %}

<h2>Factures</h2>

<table>
<tr>
    <th>ID</th>
    <th>Total</th>
    <th>Statut</th>
    <th>Date</th>
    <th>PDF</th>
</tr>

{% for f in factures %}

<tr>
    <td>#{{ f.id }}</td>
    <td>{{ f.total }} FCFA</td>
    <td>{{ f.statut }}</td>
    <td>{{ f.created_at }}</td>

    <td>
        <a href="/facture_pdf/{{ f.id }}">
            PDF
        </a>
    </td>
</tr>

{% endfor %}

</table>

{% endblock %}
